name: Deploy to Ryan's Cloud

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-pixcards
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check deploy secrets
        id: secrets
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          if [ -n "$VPS_SSH_KEY" ] && [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Deploy skipped: add the VPS_HOST, VPS_USER and VPS_SSH_KEY repository secrets (see DEPLOY.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - name: Set up SSH to the VPS
        if: steps.secrets.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload the release
        if: steps.secrets.outputs.ready == 'true'
        run: |
          tar --exclude=.git --exclude=.github --exclude=node_modules --exclude=.next -czf /tmp/release.tar.gz .
          scp -i ~/.ssh/deploy_key /tmp/release.tar.gz \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/pixcards-release.tar.gz"

      - name: Rebuild and restart on the VPS
        if: steps.secrets.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' < scripts/deploy-vps.sh
